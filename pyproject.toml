[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sccody"
version = "0.1.0"
description = "Age-conditioned single-cell population transport and disease displacement decomposition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anndata>=0.11", "numpy>=1.24", "pandas>=2", "scipy>=1.10", "torch>=2.1", "geomloss>=0.2.6", "pyyaml>=6"]

[project.scripts]
sccody = "sccody.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
